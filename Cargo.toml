[package]
name = "sha3-selkie"
version = "0.1.0"
edition = "2021"
authors = ["Deirdre Connolly <durumcrustulum@gmail.com>"]
description = "no_std FIPS 202: constant-time SHA-3 and SHAKE with zero dependencies."
license = "Apache-2.0 OR MIT"
rust-version = "1.89"
keywords = ["cryptography", "sha3", "shake", "keccak", "fips202"]
categories = ["cryptography", "no-std"]
repository = "https://github.com/selkie-cryptography/sha3-selkie"
# The fuzz and ct harnesses are separate workspaces (libfuzzer / Valgrind
# tooling), not part of the published package. CI config isn't either; the
# CAVP vectors and tests stay, so a consumer can rerun conformance.
exclude = ["fuzz", "ct", ".github"]

[features]
# Publishes the bare `Keccak-f[1600]` permutations as `#[doc(hidden)]` items,
# for `benches/permutation.rs` and cross-implementation comparison. Not part
# of the semver contract.
expose-internals = []

[dependencies]

[dev-dependencies]
# Self dev-dep so `expose-internals` is active for benches without leaking
# into the default public build. Path-only, no `version`: cargo strips it from
# the published manifest (a versioned self dev-dep can't resolve during a
# first-of-its-version publish).
sha3-selkie = { path = ".", features = ["expose-internals"] }
hex = "0.4"
proptest = "1"
# The independent SHA-3 implementation this crate cross-checks against.
libcrux-sha3 = { version = "=0.0.10", default-features = false }
divan = "0.1"

[[bench]]
name = "hash_functions"
harness = false

[[bench]]
name = "permutation"
harness = false

[lints.rust]
unsafe_code = "deny"

[profile.profiling]
inherits = "release"
debug = true
