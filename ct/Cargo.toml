[package]
name = "sha3-selkie-ct"
version = "0.0.0"
publish = false
edition = "2021"

[dev-dependencies]
sha3-selkie = { path = ".." }

# crabgrind needs <valgrind/valgrind.h>; the ctgrind test is Linux-only.
[target.'cfg(target_os = "linux")'.dev-dependencies]
crabgrind = "0.2"

# Own workspace root: keeps the Valgrind dep out of the parent crate's build
# and lockfile.
[workspace]
