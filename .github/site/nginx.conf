events {}
http {
    include mime.types;
    sendfile on;

    server {
        listen 8080;
        listen [::]:8080;
        port_in_redirect off;

        resolver 127.0.0.11;
        autoindex off;

        server_name _;
        server_tokens off;

        root /app;
        gzip_static on;

        # CI data kinds published to the Fly volume by ci-upload.rs. Keep in
        # sync with ALL_KINDS in .github/scripts/ci-upload.rs and the mkdir
        # list in entrypoint.sh.
        location /coverage-portable/ { alias /data/coverage-portable/; }
        location /coverage-avx2/ { alias /data/coverage-avx2/; }
        location /coverage-avx512/ { alias /data/coverage-avx512/; }
        location /coverage-neon/ { alias /data/coverage-neon/; }
        location /coverage-hybrid/ { alias /data/coverage-hybrid/; }
        location /bench-neon/ { alias /data/bench-neon/; }
        location /bench-neon-pairs/ { alias /data/bench-neon-pairs/; }
        location /bench-avx2/ { alias /data/bench-avx2/; }
        location /bench-avx512/ { alias /data/bench-avx512/; }
        location /bench-hybrid/ { alias /data/bench-hybrid/; }
        location /mutants-x86_64/ { alias /data/mutants-x86_64/; }
        location /mutants-x86_64-avx512/ { alias /data/mutants-x86_64-avx512/; }
        location /mutants-aarch64-apple/ { alias /data/mutants-aarch64-apple/; }
        location /mutants-aarch64-hybrid/ { alias /data/mutants-aarch64-hybrid/; }
        location /ctgrind-portable/ { alias /data/ctgrind-portable/; }
        location /ctgrind-avx2/ { alias /data/ctgrind-avx2/; }
        location /deny/ { alias /data/deny/; }
        location /unsafe/ { alias /data/unsafe/; }
        location /platform/ { alias /data/platform/; }
        location /kat/ { alias /data/kat/; }

        # Rustdoc published by ci.yml's doc job (has its own index.html).

        location = /manifest.json { alias /data/manifest.json; }
        location = /head.json { alias /data/head.json; }

        error_page 404 /404.html;
        location = /404.html { internal; }

        location /metrics { stub_status on; }
    }
}
