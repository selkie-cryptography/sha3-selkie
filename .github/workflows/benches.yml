name: Benchmarks

# Runs the divan benchmarks on a fixed runner and publishes the results as a
# build artifact plus a job-summary table. This is the data source a
# perf-trend dashboard consumes; standing up that dashboard (a fly.io site +
# an upload token) is a separate follow-up — nothing here needs new infra.
#
# Hosted-runner CPUs are shared, so absolute numbers are noisy; the artifact
# is for relative trends across commits on the same runner class, not
# publishable cycle counts.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - ".github/workflows/benches.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  bench:
    name: divan (${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One leg per vector backend: two-way NEON on aarch64 macOS, four-way AVX2
      # on x86, and the hybrid scalar/NEON kernel on the arm64 Linux runner
      # (Cobalt 100 / Neoverse N2 — a core where SHA-3 ops share SIMD units,
      # the case the hybrid exists for). `flags` forces each backend's feature
      # explicitly — sha3 is an Apple default, avx2 is not — so the active
      # backend is visible here.
      # The neon-pairs leg suppresses the hybrid on the same arm64 runner so
      # hybrid vs pure-NEON pairs is an A/B on identical Neoverse hardware.
      matrix:
        include:
          - { backend: neon, os: macos-latest, flags: "-C target-feature=+sha3" }
          - { backend: avx2, os: ubuntu-latest, flags: "-C target-feature=+avx2" }
          - { backend: hybrid, os: ubuntu-24.04-arm, flags: "-C target-feature=+sha3" }
          - { backend: neon-pairs, os: ubuntu-24.04-arm, flags: "-C target-feature=+sha3", no_hybrid: "1" }
          - { backend: avx512, os: ubuntu-latest, flags: "-C target-feature=+avx2,+avx512f,+avx512vl" }
    env:
      RUSTFLAGS: ${{ matrix.flags }}
      SHA3_SELKIE_NO_HYBRID: ${{ matrix.no_hybrid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run benchmarks
        # The avx512 leg is opportunistic: hosted runners have AVX-512 only on
        # some CPU generations, and emulated numbers would be meaningless.
        run: |
          if [ "${{ matrix.backend }}" = "avx512" ] && ! grep -q avx512f /proc/cpuinfo; then
            echo "runner CPU lacks AVX-512; benchmarks skipped" | tee bench-results.txt
            echo "BENCH_SKIPPED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          set -o pipefail
          # Both targets: the hash functions are what callers feel, the raw
          # permutation is the machine-comparable signal the trends key on.
          cargo bench --bench hash_functions --bench permutation | tee bench-results.txt
      - name: Publish to job summary
        run: |
          # shellcheck disable=SC2016  # Actions expands its own syntax first
          {
            echo '## divan benchmarks (`${{ matrix.backend }}`, `${{ runner.arch }}`, commit `${{ github.sha }}`)'
            echo '```'
            cat bench-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results-${{ matrix.backend }}
          path: bench-results.txt
          retention-days: 90
      - name: Build dashboard JSON
        if: env.BENCH_SKIPPED != '1'
        run: |
          rustc -O --edition 2021 .github/scripts/divan-to-json.rs -o /tmp/divan-to-json
          /tmp/divan-to-json < bench-results.txt > bench-flat.json
          # `summary` carries the permutation medians the trend charts key on;
          # `groups` is the per-bench table the dashboard renders.
          jq -n --arg sha "${{ github.sha }}" --argjson benches "$(cat bench-flat.json)" '{
            sha: $sha,
            updated_at: (now | todate),
            groups: (
              $benches
              | group_by(.name | split("::")[0])
              | map({
                  name: (.[0].name | split("::")[0]),
                  benchmarks: map({
                    name: (.name | split("::")[1:] | join("::")),
                    time_ns: .median_ns,
                    median_ns, fastest_ns, slowest_ns, mean_ns, samples, iters
                  })
                })
            ),
            f1600_ns: ([$benches[] | select(.name == "permutation::f1600") | .median_ns] | first),
            f1600_x2_ns: ([$benches[] | select(.name == "permutation::f1600_x2") | .median_ns] | first),
            f1600_x4_ns: ([$benches[] | select(.name == "permutation::f1600_x4") | .median_ns] | first)
          }' > bench.json
      - name: Verify the payload has data
        if: env.BENCH_SKIPPED != '1'
        run: |
          groups=$(jq '.groups | length' bench.json)
          benches=$(jq '[.groups[].benchmarks[]] | length' bench.json)
          echo "bench.json: $groups groups, $benches benchmarks."
          if [ "$groups" -eq 0 ] || [ "$benches" -eq 0 ]; then
            echo "::error::bench.json has no benchmark data."
            cat bench.json >&2 || true
            exit 1
          fi
      - name: Upload to dashboard
        if: env.BENCH_SKIPPED != '1' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: bench-${{ matrix.backend }}
          payload: bench.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
