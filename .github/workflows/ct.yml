name: Constant-time

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "ct/**"
      - "Cargo.toml"
      - ".github/workflows/ct.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Deterministic taint check: memcheck errors on any branch or address
  # derived from the secret message. A clean run is the invariant.
  ctgrind:
    name: ctgrind (${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.flags }}
    strategy:
      fail-fast: false
      # One leg per Valgrind-runnable backend. Apple NEON has no Valgrind host;
      # Valgrind cannot decode AVX-512 (the SDE test leg covers it).
      matrix:
        include:
          - { backend: portable, os: ubuntu-latest, flags: "" }
          - { backend: avx2, os: ubuntu-latest, flags: "-C target-feature=+avx2" }
          - { backend: hybrid, os: ubuntu-24.04-arm, flags: "-C target-feature=+sha3" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Valgrind first: crabgrind compiles the client requests statically when
      # <valgrind/valgrind.h> is present at build time.
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install --yes valgrind
      - name: Run under memcheck
        working-directory: ct
        run: |
          set -o pipefail
          bin=$(cargo test --test ctgrind --no-run --message-format=json \
            | jq -r 'select(.profile.test == true) | .executable' | head -1)
          valgrind --tool=memcheck --error-exitcode=1 --track-origins=yes \
            "$bin" --test-threads=1
