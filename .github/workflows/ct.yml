name: Constant-time

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "ct/**"
      - "Cargo.toml"
      - ".github/workflows/ct.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Deterministic taint check: memcheck errors on any branch or address
  # derived from the secret message. A clean run is the invariant.
  ctgrind:
    name: ctgrind (${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.flags }}
    strategy:
      fail-fast: false
      # Backends whose instructions Valgrind can decode: portable scalar and
      # four-way AVX2 on x86. Valgrind cannot decode the FEAT_SHA3 vector ops
      # (eor3/rax1/xar/bcax) the hybrid kernel uses, nor AVX-512; both are
      # branchless by construction and the SDE test leg covers AVX-512.
      matrix:
        include:
          - { backend: portable, os: ubuntu-latest, flags: "" }
          - { backend: avx2, os: ubuntu-latest, flags: "-C target-feature=+avx2" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Valgrind first: crabgrind compiles the client requests statically when
      # <valgrind/valgrind.h> is present at build time.
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install --yes valgrind
      # Runs each test individually under memcheck so an error maps to the
      # case that caused it, writes the dashboard payload, and exits nonzero
      # on any leak or broken harness — so this is the gate as well.
      - name: Run per-test memcheck report
        working-directory: ct
        run: |
          rustc -O --edition 2021 ../.github/scripts/ctgrind-report.rs -o /tmp/ctgrind-report
          /tmp/ctgrind-report "${{ github.sha }}" > ../ctgrind.json
      - name: Verify the payload has data
        if: always()
        run: jq -e '.tests > 0' ctgrind.json > /dev/null || { echo "::error::ctgrind.json has no test results"; cat ctgrind.json >&2; exit 1; }
      - name: Upload to dashboard
        if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/ci-upload
        with:
          kind: ctgrind-${{ matrix.backend }}
          payload: ctgrind.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
