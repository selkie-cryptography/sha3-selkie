name: Semver

# Flags accidental breaking API changes on PRs. Compares against the PR's base
# commit (not a published crate), so it works before the first crates.io
# release and needs no network baseline.

on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/semver.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semver-checks:
    name: API semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # need the base commit to diff the API against
      # Nightly: cargo-semver-checks generates rustdoc JSON, which is nightly-only.
      # Pinned to a nightly the checker can read: 0.49.0 takes rustdoc JSON v56,
      # v57, and v60, and nightly moved to v61 on 2026-07-28. Bump both together
      # once a release reads v61.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly-2026-07-27
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-semver-checks@0.49.0
      - run: cargo semver-checks --baseline-rev "${{ github.event.pull_request.base.sha }}"
