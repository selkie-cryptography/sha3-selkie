name: Deploy dashboard

# Deploys the CI dashboard under `.github/site/` (an nginx:alpine container)
# to Fly. The workflows publish JSON payloads to the Fly volume via
# .github/scripts/ci-upload.rs, which nginx serves under /data/<kind>/.
#
# Requires the `FLY_API_TOKEN` repository secret and a Fly app named
# `sha3-selkie-ci` (see .github/site/fly.toml).

on:
  push:
    branches: [main]
    paths:
      - ".github/site/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy CI site to Fly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@dfdfedc86b296f5e5384f755a18bf400409a15d0 # v1.4
      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: .github/site
        run: flyctl deploy --remote-only
