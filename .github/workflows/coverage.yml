name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: llvm-cov (${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One leg per backend, matching the `test` matrix in ci.yml: a backend
      # cfg'd out of a build contributes no coverage at all, so a single leg
      # would report on the scalar and NEON paths and leave avx2, avx512, and
      # hybrid invisible. Codecov merges the legs by flag.
      matrix:
        include:
          - { backend: portable, os: ubuntu-latest, flags: "" }
          - { backend: avx2, os: ubuntu-latest, flags: "-C target-feature=+avx2" }
          - { backend: neon, os: macos-latest, flags: "-C target-feature=+sha3" }
          - { backend: hybrid, os: ubuntu-24.04-arm, flags: "-C target-feature=+sha3" }
          - { backend: avx512, os: ubuntu-latest, flags: "-C target-feature=+avx2,+avx512f,+avx512vl" }
    env:
      RUSTFLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # RUSTFLAGS without an explicit target also applies to build scripts
      # and proc macros, which run on the host CPU; pinning the build target
      # scopes the AVX-512 flags to target artifacts only.
      - name: Pin the build target
        if: matrix.backend == 'avx512'
        run: echo "CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
      # The avx512 leg runs its instrumented binaries under Intel SDE, so the
      # backend is measured regardless of whether the runner's CPU has
      # AVX-512. The profile is written when the binary exits, which SDE
      # emulation does not change.
      - name: Set up Intel SDE
        if: matrix.backend == 'avx512'
        uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
      - name: Route test binaries through SDE
        if: matrix.backend == 'avx512'
        run: |
          sudo sysctl -qw kernel.yama.ptrace_scope=0
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=$SDE_PATH/sde64 -icl --" >> "$GITHUB_ENV"
      - name: Collect coverage
        run: cargo llvm-cov --all-targets --lcov --output-path lcov.info
      - name: Coverage summary
        run: |
          set -o pipefail
          echo '## Code coverage (${{ matrix.backend }})' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Generate dashboard JSON
        run: |
          rustc -O --edition 2021 .github/scripts/lcov-to-json.rs -o /tmp/lcov-to-json
          /tmp/lcov-to-json lcov.info "${{ github.sha }}" > coverage.json
      - name: Verify the payload has data
        run: jq -e '(.total.total // 0) > 0 and (.modules | length > 0)' coverage.json > /dev/null || { echo "::error::coverage.json has no module data"; head -c 2000 coverage.json >&2; exit 1; }
      # One kind per backend: a backend cfg'd out contributes no coverage, so
      # the dashboard tracks each leg separately rather than merging them.
      - name: Upload to dashboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/ci-upload
        with:
          kind: coverage-${{ matrix.backend }}
          payload: coverage.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: ${{ matrix.backend }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
