name: Audit

# Runs on every commit, not just dependency changes: the release preflight
# requires a green Audit on the tagged commit, and a required check that
# conditionally never runs blocks the merge or the release instead.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      # Pinned; keep in lockstep with the release gates.
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check
      - name: Build dashboard JSON
        if: always()
        run: |
          rustc -O --edition 2021 .github/scripts/deny-report.rs -o /tmp/deny-report
          /tmp/deny-report "${{ github.sha }}" > deny.json
      - name: Upload to dashboard
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/ci-upload
        with:
          kind: deny
          payload: deny.json
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}
